name: push
on:
  push:
    branches:
      - main
      - master
    tags:
      - v*

jobs:
  shared-operator-workflow:
    name: shared-operator-workflow
    # The shared release workflow publishes under upstream's identity and defaults its registry to
    # quay.io/<GitHub owner>; on a fork that is the wrong org and the wrong actor. Skip it on any fork
    # (github.event.repository.fork is set by GitHub, so no owner name is hard-coded). Forks build and
    # publish their images through image.yaml instead.
    if: github.event.repository.fork != true
    uses: redhat-cop/github-workflows-operators/.github/workflows/release-operator.yml@ce4bb7157ddfc909d0d4d1d4458a58fe40b2e122 # v1.1.1
    secrets:
      COMMUNITY_OPERATOR_PAT: ${{ secrets.COMMUNITY_OPERATOR_PAT }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      PR_ACTOR: "raffaele.spazzoli@gmail.com"
      RUN_UNIT_TESTS: true
      RUN_INTEGRATION_TESTS: true
      RUN_HELMCHART_TEST: true
      GO_VERSION: ~1.21
      OPERATOR_SDK_VERSION: v1.31.0
