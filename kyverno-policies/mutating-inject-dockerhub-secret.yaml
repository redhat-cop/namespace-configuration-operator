apiVersion: policies.kyverno.io/v1alpha1
kind: MutatingPolicy
metadata:
  name: inject-dockerhub-secret
  annotations:
    policies.kyverno.io/title: Inject Docker Hub imagePullSecret
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Deployment
    policies.kyverno.io/description: >-
      Automatically injects dockerhub-secret imagePullSecrets for pods and deployments
      in the namespace-configuration-operator namespace that don't already have it.
      Uses CEL-based MutatingPolicy with JSONPatch (replaces deprecated ClusterPolicy).
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
        namespaces:
          - namespace-configuration-operator
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
        namespaces:
          - namespace-configuration-operator
  matchConditions:
    - name: NeedsDockerhubSecret
      expression: |-
        (object.kind == "Pod" &&
        !(has(object.spec.imagePullSecrets) && object.spec.imagePullSecrets.exists(s, s.name == 'dockerhub-secret'))) ||
        (object.kind == "Deployment" &&
        object.metadata.name == 'namespace-configuration-operator-controller-manager' &&
        !(has(object.spec.template.spec.imagePullSecrets) && object.spec.template.spec.imagePullSecrets.exists(s, s.name == 'dockerhub-secret')))
  mutations:
    # Inject secret into Pods
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          object.kind == "Pod" &&
          !(has(object.spec.imagePullSecrets) && object.spec.imagePullSecrets.exists(s, s.name == 'dockerhub-secret')) ?
          (has(object.spec.imagePullSecrets) ?
            [JSONPatch{
              op: "add",
              path: "/spec/imagePullSecrets/0",
              value: {"name": "dockerhub-secret"}
            }] :
            [JSONPatch{
              op: "add",
              path: "/spec/imagePullSecrets",
              value: [{"name": "dockerhub-secret"}]
            }]
          ) : []
    # Inject secret into Deployments
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          object.kind == "Deployment" &&
          object.metadata.name == 'namespace-configuration-operator-controller-manager' &&
          !(has(object.spec.template.spec.imagePullSecrets) && object.spec.template.spec.imagePullSecrets.exists(s, s.name == 'dockerhub-secret')) ?
          (has(object.spec.template.spec.imagePullSecrets) ?
            [JSONPatch{
              op: "add",
              path: "/spec/template/spec/imagePullSecrets/0",
              value: {"name": "dockerhub-secret"}
            }] :
            [JSONPatch{
              op: "add",
              path: "/spec/template/spec/imagePullSecrets",
              value: [{"name": "dockerhub-secret"}]
            }]
          ) : []
  evaluation:
    admission:
      enabled: true
  webhookConfiguration:
    timeoutSeconds: 10
