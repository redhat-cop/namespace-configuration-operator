apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../default

# The base has ALREADY renamed the placeholder `controller` to the redhat-cop image
# (config/manager/kustomization.yaml), so that is the name to match here. Matching `controller`
# matched nothing, and the overlay silently deployed upstream's image.
images:
  - name: quay.io/redhat-cop/namespace-configuration-operator
    newName: quay.io/ephico2real/namespace-configuration-operator
    newTag: latest

# Address the manager container BY NAME. After the auth-proxy patch, containers/0 is
# kube-rbac-proxy, which a positional JSON patch used to modify instead.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller-manager
        namespace: system
      spec:
        template:
          spec:
            containers:
              - name: manager
                imagePullPolicy: Always
