apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: namespace-configuration-operator
    openshift.io/cluster-monitoring: "true"
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: namespace-configuration-operator
spec:
  selector:
    matchLabels:
      control-plane: namespace-configuration-operator
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: namespace-configuration-operator
    spec:
      containers:
      - command:
        - /manager
        # NOTE: config/default/manager_auth_proxy_patch.yaml replaces this whole list (Args has no
        # merge key). Keep the two in step; the patch is what the rendered Deployment carries.
        args:
        - --leader-elect
        # Log level configuration via command-line flags (recommended by Operator SDK)
        # See: https://sdk.operatorframework.io/docs/building-operators/golang/references/logging/
        # Alternative: Use environment variables (ZAP_LOG_LEVEL, ZAP_DEVEL) for ConfigMap-based config
        - --zap-log-level=info
        - --zap-devel=false
        image: controller:latest
        name: manager
        env:
        # Optional: Override via environment variables (lower priority than args)
        # Uncomment to use ConfigMap-based configuration instead of args
        # - name: ZAP_LOG_LEVEL
        #   value: "info"
        # - name: ZAP_DEVEL
        #   value: "false"
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 20Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
